# Render Blueprint — deploys the NestJS API only. The Next.js frontend is hosted
# separately (Vercel) and reaches this service through its API_BASE_URL env var.
# Spec: https://render.com/docs/blueprint-spec
#
# The API service already exists as `eos-pmd` (https://eos-pmd.onrender.com).
# Required env vars (dashboard, marked sync:false):
#   AUTH_SECRET  = the SAME value as the frontend host's AUTH_SECRET
#   MONGODB_URI  = the Atlas connection string
#
# Atlas Network Access must allow Render's egress (0.0.0.0/0 unless on a paid
# instance with static outbound IPs). `free` instances sleep after 15 min idle.

services:
  - type: web
    name: eos-pmd
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
