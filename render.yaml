# Render Blueprint — deploys the NestJS API only. The Next.js frontend runs on
# Vercel and reaches this service through the API_BASE_URL env var set there.
# Spec: https://render.com/docs/blueprint-spec
#
# First deploy:
#   1. Render dashboard -> New -> Blueprint -> pick this repo.
#   2. When prompted, set:
#        AUTH_SECRET  = the SAME value as the Vercel project's AUTH_SECRET
#        MONGODB_URI  = the Atlas connection string (same DB the app already uses)
#   3. After it goes live, add API_BASE_URL = https://<this-service>.onrender.com/api
#      to the Vercel project and redeploy the frontend.
#
# Atlas Network Access must allow Render's egress (you've set 0.0.0.0/0).
# The `free` instance type sleeps after 15 min idle; use `starter` to avoid
# cold starts.

services:
  - type: web
    name: eos-pmd-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        sync: false # must match the Vercel project's AUTH_SECRET exactly
      - key: MONGODB_URI
        sync: false # Atlas connection string
